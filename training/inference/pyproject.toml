[project]
name = "safmn-infer"
version = "0.1.0"
description = "Standalone inference CLI for Real_SAFMN++ (and base SAFMN)"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "numpy>=2.1",
  "opencv-python-headless>=4.10",
  "tqdm>=4.66",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
safmn-infer = "safmn_infer.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["safmn_infer"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cv2.*", "tqdm.*"]
ignore_missing_imports = true
