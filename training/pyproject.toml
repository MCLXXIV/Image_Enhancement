[project]
name = "safmn-training"
version = "0.1.0"
description = "Fine-tuning Real_SAFMN++ on real-estate photos"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "numpy>=2.1",
  "opencv-python-headless>=4.10",
  "scikit-image>=0.24",
  "pillow>=11.0",
  "tqdm>=4.66",
  "structlog>=24.4",
  "mlflow>=2.19",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
lpips = ["lpips>=0.1.4"]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
safmn-train = "training.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["training"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cv2.*", "mlflow.*", "torchvision.*", "tqdm.*", "skimage.*", "lpips.*"]
ignore_missing_imports = true
