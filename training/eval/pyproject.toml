[project]
name = "sr-eval"
version = "0.1.0"
description = "Full-reference quality eval (PSNR/SSIM/LPIPS) for SR/enhancement outputs"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1",
  "opencv-python-headless>=4.10",
  "scikit-image>=0.24",
  "pandas>=2.2",
  "tqdm>=4.66",
  "structlog>=24.4",
]

[project.optional-dependencies]
lpips = [
  "torch>=2.4",
  "lpips>=0.1.4",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
sr-eval = "sr_eval.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sr_eval"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cv2.*", "lpips.*", "skimage.*", "tqdm.*"]
ignore_missing_imports = true
