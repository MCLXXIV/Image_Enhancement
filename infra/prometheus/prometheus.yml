global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: image-enhancement-dev

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: enhancer
    metrics_path: /metrics
    static_configs:
      - targets: ["enhancer:8000"]
