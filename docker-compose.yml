name: image-enhancement

services:
  enhancer:
    build:
      context: ./services/enhancer
      dockerfile: Dockerfile
    image: image-enhancement/enhancer:dev
    container_name: enhancer
    environment:
      ENHANCER_HOST: 0.0.0.0
      ENHANCER_PORT: 8000
      ENHANCER_LOG_LEVEL: INFO
      MLFLOW_TRACKING_URI: http://mlflow:5000
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SAFMN_X2_WEIGHTS_PATH: ${SAFMN_X2_WEIGHTS_PATH:-/weights/SAFMN_L_Real_LSDIR_x2.pth}
      SAFMN_X4_WEIGHTS_PATH: ${SAFMN_X4_WEIGHTS_PATH:-/weights/SAFMN_L_Real_LSDIR_x4.pth}
      SAFMN_TILE: ${SAFMN_TILE:-256}
      SR_TARGET_LONG_SIDE: ${SR_TARGET_LONG_SIDE:-1920}
      SAFMN_DEVICE: ${SAFMN_DEVICE:-cpu}
      SAFMN_FP16: ${SAFMN_FP16:-false}
      SAFMN_DIM: ${SAFMN_DIM:-128}
      LOWLIGHT_WEIGHTS_PATH: ${LOWLIGHT_WEIGHTS_PATH:-/weights/LOL_v2_real.pth}
      LOWLIGHT_DEVICE: ${LOWLIGHT_DEVICE:-cpu}
      LOWLIGHT_N_FEAT: ${LOWLIGHT_N_FEAT:-40}
      LOWLIGHT_STAGE: ${LOWLIGHT_STAGE:-1}
      LOWLIGHT_NUM_BLOCKS: ${LOWLIGHT_NUM_BLOCKS:-1,2,2}
      LOWLIGHT_STRENGTH: ${LOWLIGHT_STRENGTH:-0.8}
      EXPOSURE_WEIGHTS_PATH: ${EXPOSURE_WEIGHTS_PATH:-/weights/iat_exposure.pth}
      EXPOSURE_DEVICE: ${EXPOSURE_DEVICE:-cpu}
      RESTORE_WEIGHTS_PATH: ${RESTORE_WEIGHTS_PATH:-/weights/scunet_color_real_psnr.pth}
      RESTORE_DEVICE: ${RESTORE_DEVICE:-cpu}
      RESTORE_DIM: ${RESTORE_DIM:-64}
      RESTORE_CONFIG: ${RESTORE_CONFIG:-4,4,4,4,4,4,4}
      IQA_DEVICE: ${IQA_DEVICE:-cpu}
      IQA_GATE_ENABLED: ${IQA_GATE_ENABLED:-true}
    volumes:
      - ./data/weights:/weights:ro
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped

  demo:
    build:
      context: ./services/demo
      dockerfile: Dockerfile
    image: image-enhancement/demo:dev
    container_name: demo
    environment:
      ENHANCER_URL: http://enhancer:8000
    ports:
      - "8501:8501"
    depends_on:
      - enhancer
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - ./.volumes/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/realestate-raw &&
      mc mb --ignore-existing local/mlflow-artifacts &&
      echo 'buckets ready';
      "
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - ./.volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: >
      /bin/sh -c "
      pip install --quiet psycopg2-binary boto3 &&
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
        --artifacts-destination s3://mlflow-artifacts
        --serve-artifacts
      "
    ports:
      - "5000:5000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.volumes/prometheus:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./.volumes/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
