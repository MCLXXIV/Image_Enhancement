name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  enhancer:
    name: enhancer (lint + types + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/enhancer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/enhancer/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -q

  docker-build:
    name: docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build enhancer image
        run: docker build -t enhancer:ci services/enhancer

      - name: Build demo image
        run: docker build -t demo:ci services/demo
