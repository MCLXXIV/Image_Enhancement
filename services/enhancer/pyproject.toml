[project]
name = "enhancer"
version = "0.1.0"
description = "Image enhancement microservice for Avito real estate photos"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "numpy>=2.1",
  "opencv-python-headless>=4.10",
  "pillow>=11.0",
  "torch>=2.4",
  "einops>=0.8",
  "timm>=0.9",
  "thop>=0.1",
  "pyiqa>=0.1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "gdown>=5.0",
  "kagglehub>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Вендоренные 1:1 архитектуры, внешний код, не приводим к нашему стилю.
extend-exclude = [
  "src/enhancer/models/_scunet_arch.py",
  "src/enhancer/models/_retinexformer_arch.py",
  "src/enhancer/models/_iat_arch.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["enhancer"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cv2.*", "pyiqa.*", "einops.*", "timm.*", "thop.*"]
ignore_missing_imports = true

# Вендоренные 1:1 архитектуры, внешний код, mypy их не проверяет.
[[tool.mypy.overrides]]
module = [
  "enhancer.models._scunet_arch",
  "enhancer.models._retinexformer_arch",
  "enhancer.models._iat_arch",
]
ignore_errors = true

# Модельные обёртки вызывают нетипизированный torch (forward даёт Any). Ослабляем
# два strict-флага только тут, остальной пакет остаётся под mypy --strict.
[[tool.mypy.overrides]]
module = ["enhancer.models.*"]
warn_return_any = false
disallow_untyped_calls = false
